name: MuxBot
options:
  bundleIdPrefix: com.darklyenergized
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is deliberately not set here: see Config/Base.xcconfig.
    ENABLE_PREVIEWS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE

targets:
  MuxBot:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: MuxBot
    info:
      path: MuxBot/Info.plist
      properties:
        CFBundleDisplayName: Mux Bot
        # The menu bar and About panel read CFBundleName on macOS.
        CFBundleName: Mux Bot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Temporary live-preview server for the humancodereader seed bot;
        # set MUXBOT_TEST_PREVIEW_URL in the gitignored Config/Local.xcconfig.
        MuxBotTestPreviewURL: $(MUXBOT_TEST_PREVIEW_URL)
        MuxBotTestWorkdir: $(MUXBOT_TEST_WORKDIR)
        MuxBotDarkmuxCLI: $(MUXBOT_DARKMUX_CLI)
        # Tailnet previews are plain http until tailnet HTTPS certificates
        # are enabled; allow it for *.ts.net only.
        NSAppTransportSecurity:
          # darkmux's local client endpoint on this Mac (127.0.0.1).
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        LSApplicationCategoryType: public.app-category.developer-tools
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darklyenergized.darkmuxapp
        # "Mux Bot.app": the Finder and the Dock show the bundle's file name.
        # The Swift module stays MuxBot (tests import it).
        PRODUCT_NAME: Mux Bot
        PRODUCT_MODULE_NAME: MuxBot
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: YES
        # Read-only GitHub API calls (bots' issue lookups).
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  MuxBotTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: MuxBotTests
    dependencies:
      - target: MuxBot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.darklyenergized.darkmuxapp.tests
        # The app is "Mux Bot.app"; the macOS bundle nests its binary.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mux Bot.app/Mux Bot"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Mux Bot.app/Contents/MacOS/Mux Bot"

schemes:
  MuxBot:
    build:
      targets:
        MuxBot: all
    test:
      targets:
        - MuxBotTests
    run:
      config: Debug
    archive:
      config: Release
